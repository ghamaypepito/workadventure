# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://matrix-org.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "connectiumai.com"
public_baseurl: https://matrix.connectiumai.com/
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [ client, federation ]
        compress: false
database:
  name: psycopg2
  args:
    user: "${PGUSER}"
    password: "${PGPASSWORD}"
    database: "${PGDATABASE}"
    host: "${PGHOST}"
    port: "${PGPORT}"
    cp_min: 5
    cp_max: 10
log_config: "/data/matrix.workadventure.localhost.log.config"
media_store_path: /data/media_store
report_stats: false
registration_shared_secret: "${REGISTRATION_SHARED_SECRET}"
macaroon_secret_key: "${MACAROON_SECRET_KEY}"
form_secret: "${FORM_SECRET}"
signing_key_path: "/data/matrix.workadventure.localhost.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

oidc_providers:
  - idp_id: google
    idp_name: Google
    issuer: "https://accounts.google.com"
    client_id: "${GOOGLE_OIDC_CLIENT_ID}"
    client_secret: "${GOOGLE_OIDC_CLIENT_SECRET}"
    scopes: [ "openid", "email", "profile" ]
    user_profile_method: "userinfo_endpoint"
    user_mapping_provider:
      config:
        localpart_template: "{{ user.email.split('@')[0] }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"
  - idp_id: microsoft
    idp_name: Microsoft
    issuer: "https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/v2.0"
    client_id: "${MICROSOFT_OIDC_CLIENT_ID}"
    client_secret: "${MICROSOFT_OIDC_CLIENT_SECRET}"
    scopes: [ "openid", "email", "profile" ]
    user_profile_method: "userinfo_endpoint"
    user_mapping_provider:
      config:
        localpart_template: "{{ user.email.split('@')[0] }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"

sso:
  client_whitelist:
    - "${PXLCODE_PLAY_URL}"
    - "${VINGS_PLAY_URL}"

enable_registration: false
allow_guest_access: false
turn_allow_guests: false
enable_authenticated_media: false

autocreate_auto_join_rooms: false

user_directory:
  search_all_users: true

rc_login:
  address:
    per_second: 0.15
    burst_count: 10
  account:
    per_second: 0.18
    burst_count: 10
  failed_attempts:
    per_second: 0.19
    burst_count: 10
rc_room_creation:
  per_second: 10
  burst_count: 10000
