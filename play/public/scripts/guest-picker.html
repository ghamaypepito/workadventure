<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Who are you here to see?</title>
<script src="https://pxlcode-workplace.vercel.app/iframe_api.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 1.25rem; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  p.subtitle { color: #94a3b8; font-size: 0.85rem; margin: 0 0 1rem; }
  input#search { width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; margin-bottom: 1rem; font-size: 0.9rem; }
  .member-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 60vh; overflow-y: auto; }
  .member-btn { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem 1rem; color: inherit; text-align: left; cursor: pointer; font-size: 0.9rem; transition: border-color 0.15s; }
  .member-btn:hover { border-color: #6366f1; }
  .member-btn.selected { background: #334155; border-color: #6366f1; }
  .member-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; }
  .error { color: #f87171; }
  .empty { color: #94a3b8; font-size: 0.9rem; }
  button.primary { margin-top: 1.25rem; width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background: #334155; color: #64748b; font-weight: 600; cursor: not-allowed; }
  button.primary.enabled { background: #10b981; color: #0f172a; cursor: pointer; }
  button.secondary { margin-top: 0.75rem; width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: transparent; color: #e2e8f0; cursor: pointer; font-size: 0.85rem; }
  .waiting { text-align: center; padding: 2rem 0; }
  .retry-btn { margin-top: 0.75rem; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <h1>Who are you here to see?</h1>
  <p class="subtitle">Selected member will let you in</p>
  <input id="search" placeholder="Search members">
  <div id="list" class="member-list"><div class="empty">Loading members&hellip;</div></div>
  <button id="notifyBtn" class="primary" disabled>Notify member</button>
</div>
<div id="status" class="status"></div>

<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const guestName = params.get('name') || 'Guest';

    const appEl = document.getElementById('app');
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const notifyBtn = document.getElementById('notifyBtn');
    const statusEl = document.getElementById('status');

    let members = [];
    let selected = null;
    let currentRequestId = null;
    // True for the duration of an in-flight POST /api/admission/request. Guards against a
    // second Notify click, or a new member selection, firing another request while one is
    // still outstanding - the in-flight request has no requestId yet (it only gets one once
    // the POST resolves), so cancelCurrent() has nothing to cancel and the server-side entry
    // would otherwise be orphaned forever (see Issue A).
    let sendInFlight = false;
    // Monotonically increasing generation counter. Each poll closure captures the
    // generation value at schedule time; after its await resolves, it checks the
    // generation is still current before acting or scheduling the next poll. This is
    // the fix for the same class of bug as the currentZone scope bug: a clearTimeout
    // alone cannot stop an in-flight await from completing and scheduling another loop.
    let generation = 0;

    function showError(message, retryFn) {
        statusEl.innerHTML = '';
        const msg = document.createElement('div');
        msg.className = 'error';
        msg.textContent = message;
        statusEl.appendChild(msg);
        if (retryFn) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.textContent = 'Retry';
            retryBtn.addEventListener('click', retryFn);
            statusEl.appendChild(retryBtn);
        }
    }

    function clearStatus() {
        statusEl.innerHTML = '';
    }

    async function loadMembers() {
        try {
            const res = await fetch('/api/admission/known-members');
            if (!res.ok) throw new Error('Could not load members');
            const data = await res.json();
            members = data.members || [];
            clearStatus();
            renderList();
        } catch (e) {
            listEl.innerHTML = '';
            showError('Could not load members. Check your connection and try again.', loadMembers);
        }
    }

    function renderList() {
        const filter = searchEl.value.toLowerCase();
        listEl.innerHTML = '';
        const filtered = members
            .filter((m) => m.email.toLowerCase().includes(filter))
            .sort((a, b) => Number(b.online) - Number(a.online));

        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="empty">No members match your search.</div>';
            return;
        }

        filtered.forEach((m) => {
            const btn = document.createElement('button');
            btn.className = 'member-btn' + (selected === m.email ? ' selected' : '');
            btn.textContent = m.email + (m.online ? ' — Active now' : ' — Offline');
            btn.disabled = !m.online;
            if (m.online) {
                btn.addEventListener('click', () => {
                    selected = m.email;
                    if (!sendInFlight) {
                        notifyBtn.disabled = false;
                        notifyBtn.classList.add('enabled');
                    }
                    renderList();
                });
            }
            listEl.appendChild(btn);
        });
    }

    function showPicker() {
        appEl.style.display = '';
        clearStatus();
        renderList();
    }

    function showWaiting(targetEmail) {
        appEl.style.display = 'none';
        statusEl.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'waiting';
        wrap.innerHTML =
            '<div>Waiting for ' + targetEmail + '&hellip;</div>';
        const chooseBtn = document.createElement('button');
        chooseBtn.className = 'secondary';
        chooseBtn.textContent = 'Choose someone else';
        chooseBtn.addEventListener('click', async () => {
            await cancelCurrent();
            showPicker();
        });
        wrap.appendChild(chooseBtn);
        statusEl.appendChild(wrap);
    }

    async function cancelCurrent() {
        generation += 1; // invalidate any in-flight poll for the old request
        if (currentRequestId) {
            const idToCancel = currentRequestId;
            currentRequestId = null;
            try {
                await fetch('/api/admission/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requestId: idToCancel }),
                });
            } catch (e) {
                // Best-effort: if cancel fails the entry will simply expire server-side.
                console.error('[admission] cancel failed', e);
            }
        }
    }

    async function sendRequestTo(targetEmail) {
        if (sendInFlight) return;
        sendInFlight = true;
        notifyBtn.disabled = true;
        notifyBtn.classList.remove('enabled');
        try {
            await cancelCurrent();
            const myGeneration = ++generation;
            try {
                const res = await fetch('/api/admission/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: guestName, targetEmail }),
                });
                if (myGeneration !== generation) return;
                if (!res.ok) throw new Error('Could not send request');
                const data = await res.json();
                if (myGeneration !== generation) return;
                currentRequestId = data.requestId;
                showWaiting(targetEmail);
                schedulePoll(myGeneration);
            } catch (e) {
                if (myGeneration !== generation) return;
                showError('Could not notify ' + targetEmail + '. Check your connection and try again.', () =>
                    sendRequestTo(targetEmail),
                );
            }
        } finally {
            sendInFlight = false;
            // Re-enable the button only if a member is still selected (showWaiting hides the
            // picker entirely on success, so this is effectively a no-op in that case).
            if (selected) {
                notifyBtn.disabled = false;
                notifyBtn.classList.add('enabled');
            }
        }
    }

    function schedulePoll(myGeneration) {
        setTimeout(() => poll(myGeneration), 3000);
    }

    async function poll(myGeneration) {
        if (myGeneration !== generation) return;
        const requestId = currentRequestId;
        if (!requestId) return;
        try {
            const res = await fetch('/api/admission/status?requestId=' + encodeURIComponent(requestId));
            if (myGeneration !== generation) return;
            if (!res.ok) throw new Error('Status check failed');
            const data = await res.json();
            if (myGeneration !== generation) return;

            if (data.status === 'approved') {
                if (data.x !== null && data.y !== null && data.x !== undefined && data.y !== undefined) {
                    await WA.player.teleport(data.x, data.y);
                }
                WA.controls.restorePlayerControls();
                WA.nav.closeCoWebSite();
                return;
            }

            if (data.status === 'not_found') {
                currentRequestId = null;
                showError('That request is no longer active — pick someone else.');
                setTimeout(() => {
                    if (myGeneration !== generation) return;
                    showPicker();
                }, 1500);
                return;
            }

            // still pending
            schedulePoll(myGeneration);
        } catch (e) {
            if (myGeneration !== generation) return;
            showError('Lost connection while waiting for a response.', () => schedulePoll(myGeneration));
        }
    }

    searchEl.addEventListener('input', renderList);
    notifyBtn.addEventListener('click', () => {
        if (selected && !sendInFlight) sendRequestTo(selected);
    });

    WA.onInit().then(loadMembers);
})();
</script>
</body>
</html>
