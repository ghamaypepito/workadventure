<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://office.connectiumai.com/iframe_api.js"></script>
</head>
<body>
<script>
(function () {
    async function offerSeatPicker() {
        await WA.nav.openCoWebSite('/scripts/seat-picker.html', true, undefined, 40, 0, true);
    }

    let currentZone = null;

    async function guestApi(body) {
        const res = await fetch('/api/guests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Guest request failed');
        return data;
    }

    async function pollPendingAdmissions() {
        const notified = new Set();
        const check = async () => {
            try {
                const { visits } = await guestApi({ action: 'pending' });
                if (visits.some(visit => !notified.has(visit.id))) {
                    visits.forEach(visit => notified.add(visit.id));
                    WA.ui.modal.openModal({ src: new URL('/scripts/guest-requests.html', window.location.origin).toString(), title: 'Guest entry requests', position: 'center', allowApi: true, allowFullScreen: false, closable: true });
                }
                const active = new Set(visits.map(visit => visit.id));
                for (const id of notified) if (!active.has(id)) notified.delete(id);
            } catch (error) { console.error('[admission] pending requests unavailable', error); }
            setTimeout(check, 5000);
        };
        check();
    }

    async function waitForGuestEntry() {
        WA.controls.disablePlayerControls();
        let visit;
        try { visit = JSON.parse(sessionStorage.getItem('wa:guest-visit')); } catch { visit = null; }
        if (!visit) visit = await guestApi({ action: 'begin', name: WA.player.name });
        sessionStorage.setItem('wa:guest-visit', JSON.stringify(visit));
        const initial = await guestApi({ ...visit, action: 'status' });
        if (initial.status !== 'approved') WA.ui.modal.openModal({ src: new URL('/scripts/guest-entry.html', window.location.origin).toString(), title: 'Request entry', position: 'center', allowApi: false, closable: false });
        let nextState = initial;
        let admitted = initial.status === 'approved';
        if (admitted) WA.controls.restorePlayerControls();
        const check = async () => {
            try {
                const state = nextState || await guestApi({ ...visit, action: 'status' });
                nextState = null;
                if (['removed', 'declined', 'expired'].includes(state.status)) {
                    sessionStorage.removeItem('wa:guest-visit');
                    WA.controls.disablePlayerControls();
                    WA.nav.goToPage('/guest-removed.html');
                    return;
                }
                if (state.status === 'approved' && !admitted) {
                    WA.ui.modal.closeModal();
                    WA.controls.restorePlayerControls();
                    admitted = true;
                }
            } catch (error) { console.error('[admission] visit check failed', error); }
            setTimeout(check, 3000);
        };
        check();
    }

    WA.onInit().then(async () => {
        // Verify the signed session rather than trusting the editable display cookie.
        WA.controls.disablePlayerControls();
        const response = await fetch('/api/auth/session-status');
        if (!response.ok) throw new Error('Unable to check office session');
        const session = await response.json();
        if (!session.authenticated) {
            const access = await guestApi({ action: 'access', room: WA.room.id });
            if (!access.enabled) { WA.controls.restorePlayerControls(); return; }
            await waitForGuestEntry();
            return;
        }
        const user = session.user;
        WA.controls.restorePlayerControls();

        // Register this session's WA player uuid -> SSO email, so chat history (keyed by uuid on
        // the client) can be resolved to the account's email server-side. This is what makes chat
        // history follow the account across devices/browsers instead of being tied to whichever
        // browser-local WA uuid happens to be active.
        try {
            const uuid = await WA.player.uuid;
            fetch('/api/admission/identity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uuid }),
            }).catch((e) => console.error('[admission] identity registration failed', e));
        } catch (e) {
            console.error('[admission] failed to read player uuid for identity registration', e);
        }

        // Recognized (non-guest) user: enters immediately, no wait.

        const KNOWN_ZONES = [
            'Special rooom 01',
            'Conference 01',
            'Conference 02',
            'Demo rooom 1',
            'Demo Room 2',
            'Demo Room 3',
        ];
        KNOWN_ZONES.forEach((zoneName) => {
            WA.room.onEnterZone(zoneName, () => {
                currentZone = zoneName;
                // Persist the room right here, as the primary mechanism - beforeunload is
                // unreliable (doesn't fire on mobile backgrounding, crashes, etc.) and is
                // kept below only as a harmless backstop. Fire-and-forget: don't block
                // zone-entry handling on the network round-trip.
                fetch('/api/admission/room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: zoneName }),
                }).catch((e) => console.error('[admission] failed to persist last room', e));
            });
            WA.room.onLeaveZone(zoneName, () => {
                if (currentZone === zoneName) currentZone = null;
            });
        });

        // Keep this user's presence fresh in the known-members list (see PRESENCE_TTL_SECONDS
        // in api/_lib/presence.js — must heartbeat more often than that TTL).
        let avatar = null;
        WA.player.getWokaPicture().then((picture) => { avatar = picture; }).catch((e) => console.error('[admission] avatar unavailable', e));
        function sendHeartbeat() {
            fetch('/api/admission/heartbeat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: WA.player.name, avatar }),
            }).catch((e) => console.error('[admission] heartbeat failed', e));
        }
        setInterval(sendHeartbeat, 20000);
        sendHeartbeat();

        // Persist the current zone on the way out, so it can be restored next login.
        window.addEventListener('beforeunload', () => {
            if (currentZone) {
                navigator.sendBeacon(
                    '/api/admission/room',
                    new Blob([JSON.stringify({ room: currentZone })], { type: 'application/json' }),
                );
            }
        });

        // TODO: seat picker UI needs more work before it's shown again - re-enable the two
        // `await offerSeatPicker();` calls below (and drop this flag) once it's ready. The
        // "Choose my seat" menu command has been removed too (see below), so there's currently
        // no way to reach it from the UI at all - offerSeatPicker() stays defined but unused.
        const AUTO_SEAT_PICKER_ENABLED = false;

        // If we have a persisted last room, spawn there and skip the seat-picker entirely.
        // Otherwise (first-ever login, or on any failure below), fall back to the safe
        // default of showing the seat-picker. This whole decision is wrapped in its own
        // self-contained try/catch (including a nested catch around the fallback
        // offerSeatPicker() call) so that no failure here - not the room lookup, not either
        // offerSeatPicker() call - can ever escape and prevent the unconditional trailer
        // code below (menu command registration, pollPendingAdmissions) from running.
        try {
            const lastRoomRes = await fetch('/api/admission/room');
            const lastRoom = await lastRoomRes.json();
            if (lastRoom.room && lastRoom.x !== null && lastRoom.y !== null) {
                await WA.player.teleport(lastRoom.x, lastRoom.y);
            } else if (AUTO_SEAT_PICKER_ENABLED) {
                await offerSeatPicker();
            }
        } catch (e) {
            console.error('[admission] last-room lookup failed, falling back to seat picker', e);
            if (AUTO_SEAT_PICKER_ENABLED) {
                try {
                    await offerSeatPicker();
                } catch (e2) {
                    console.error('[admission] seat picker fallback also failed', e2);
                }
            }
        }

        // Recognized users also watch for guests waiting to be let in (only requests
        // targeted at them, per the pending() filter in api/admission/[...admissionPath].js).
        // Run this unconditionally regardless of which branch above ran or whether it errored.
        pollPendingAdmissions();
    }).catch(error => {
        console.error('[admission] unable to initialize entry', error);
        WA.nav.goToPage('/guest-removed.html?reason=unavailable');
    });
})();
</script>
</body>
</html>
